<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 920 510"
     font-family="'Linux Biolinum','Helvetica','Arial',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <style><![CDATA[
      text             { font-size: 11px; fill: #111; }
      .title           { font-weight: 600; font-size: 12px; }
      .big-title       { font-weight: 600; font-size: 14px; }
      .subtitle        { font-size: 9px;  fill: #555; }
      .stage-name      { font-weight: 600; font-size: 13px; fill: #1e40af; }
      .role-statement  { font-size: 11px; font-style: italic; fill: #1e293b; }
      .role-output     { font-size: 10px; fill: #475569; }
      .impl-hint       { font-family: 'Consolas','Menlo','DejaVu Sans Mono',monospace;
                         font-size: 9px; fill: #64748b; }
      .container       { fill: #fafafa; stroke: #888; stroke-width: 1.2; }
      .composer        { fill: #f5f5f5; stroke: #444; stroke-width: 1.5; }
      .core-box        { fill: #fcfcfc; stroke: #666; stroke-width: 1.2;
                         stroke-dasharray: 2 2; }
      .stage           { fill: #eef3fb; stroke: #1e40af; stroke-width: 1.2;
                         stroke-dasharray: 4 3; }
      .badge           { fill: #1e40af; stroke: none; }
      .badge-text      { fill: #ffffff; font-size: 11px; font-weight: 700;
                         text-anchor: middle; dominant-baseline: central; }
      .foundation      { fill: #ececec; stroke: #555; stroke-width: 1; }
      .client-ds       { fill: #f0eaff; stroke: #6b3fa0; stroke-width: 1.2; }
      .client-l4s      { fill: #fff7e3; stroke: #a87014; stroke-width: 1.2; }
      .client-cake     { fill: #eef8ea; stroke: #2f7a2d; stroke-width: 1.2; }
      .client-head     { font-weight: 700; font-size: 11px; }
      .client-body     { font-size: 10px; fill: #1f2a44; }
      .client-reuse    { font-size: 9px; font-style: italic; fill: #4b5563; }
      .client-ds-t     { fill: #4a2a70; }
      .client-l4s-t    { fill: #7a4e0f; }
      .client-cake-t   { fill: #1d4e1b; }
    ]]></style>
  </defs>

  <!-- ====== Title band ====== -->
  <text x="460" y="22" text-anchor="middle" class="big-title">
    A composable substrate for active queue management
  </text>
  <text x="460" y="38" text-anchor="middle" class="subtitle">
    four pluggable strategies  ·  two DS-node types (edge, core)  ·  three concrete compositions (classical DiffServ, L4S, CAKE)
  </text>

  <!-- Packet ingress box removed: the arrow implied pipeline-flow semantics,
       and the Classify & Meter tile already names ingress responsibilities. -->


  <!-- ====== Outer composer (edge) — shifted left to free right-side space for the
               widened core peer.  All internal coordinates stay the same; the
               group transform handles the shift. ====== -->
  <g transform="translate(-95, 0)">
  <rect x="120" y="55" width="685" height="345" rx="10" class="composer"/>
  <text x="367" y="74" text-anchor="middle" class="title">The four pluggable strategies (component catalogue)</text>

  <!-- ====== STAGE 1 — Classify & Meter ====== -->
  <rect x="137" y="95" width="150" height="285" rx="7" class="stage"/>
  <circle cx="152" cy="108" r="11" class="badge"/>
  <text x="152" y="108" class="badge-text">1</text>
  <text x="214" y="110" text-anchor="middle" class="stage-name">Classify &amp; Meter</text>

  <text x="212" y="144" text-anchor="middle" class="role-statement">decides which</text>
  <text x="212" y="158" text-anchor="middle" class="role-statement">service class a</text>
  <text x="212" y="172" text-anchor="middle" class="role-statement">packet belongs to</text>

  <line x1="152" y1="190" x2="272" y2="190" stroke="#94a3b8"
        stroke-width="0.7" stroke-dasharray="3 2"/>

  <text x="212" y="208" text-anchor="middle" class="role-output">inputs: 5-tuple,</text>
  <text x="212" y="221" text-anchor="middle" class="role-output">DSCP, ECN, rate</text>
  <text x="212" y="234" text-anchor="middle" class="role-output">history</text>

  <text x="212" y="258" text-anchor="middle" class="role-output">output: conformance</text>
  <text x="212" y="271" text-anchor="middle" class="role-output">colour (green / yellow</text>
  <text x="212" y="284" text-anchor="middle" class="role-output">/ red) + class tag</text>

  <line x1="152" y1="304" x2="272" y2="304" stroke="#94a3b8"
        stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="212" y="322" text-anchor="middle" class="impl-hint">impl.: TB / srTCM / trTCM /</text>
  <text x="212" y="333" text-anchor="middle" class="impl-hint">TSW / per-flow meter</text>
  <text x="212" y="348" text-anchor="middle" class="impl-hint">RFC 2697 / 2698 / 2859</text>
  <rect x="154" y="358" width="120" height="14" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="0.6"/>
  <text x="214" y="368" text-anchor="middle" class="subtitle" fill="#312e81">■ this work</text>

  <!-- ====== STAGE 2 — Mark & Route ====== -->
  <rect x="312" y="95" width="130" height="285" rx="7" class="stage"/>
  <circle cx="327" cy="108" r="11" class="badge"/>
  <text x="327" y="108" class="badge-text">2</text>
  <text x="389" y="110" text-anchor="middle" class="stage-name">Mark &amp; Route</text>

  <text x="377" y="144" text-anchor="middle" class="role-statement">stamps class label;</text>
  <text x="377" y="158" text-anchor="middle" class="role-statement">maps label to one</text>
  <text x="377" y="172" text-anchor="middle" class="role-statement">of N parallel queues</text>

  <line x1="327" y1="190" x2="427" y2="190" stroke="#94a3b8"
        stroke-width="0.7" stroke-dasharray="3 2"/>

  <text x="377" y="208" text-anchor="middle" class="role-output">output: queue index</text>
  <text x="377" y="221" text-anchor="middle" class="role-output">(lookup table)</text>

  <line x1="327" y1="240" x2="427" y2="240" stroke="#94a3b8"
        stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="377" y="258" text-anchor="middle" class="impl-hint">impl.: DSCP → slot</text>
  <text x="377" y="269" text-anchor="middle" class="impl-hint">(up to 8 slots)</text>
  <rect x="327" y="358" width="100" height="14" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="0.6"/>
  <text x="377" y="368" text-anchor="middle" class="subtitle" fill="#312e81">■ this work</text>

  <!-- ====== STAGE 3 — Per-class Queues ====== -->
  <rect x="467" y="95" width="160" height="285" rx="7" class="stage"/>
  <circle cx="482" cy="108" r="11" class="badge"/>
  <text x="482" y="108" class="badge-text">3</text>
  <text x="549" y="110" text-anchor="middle" class="stage-name">Per-class Queues</text>

  <text x="547" y="144" text-anchor="middle" class="role-statement">each class has its</text>
  <text x="547" y="158" text-anchor="middle" class="role-statement">own queueing</text>
  <text x="547" y="172" text-anchor="middle" class="role-statement">discipline</text>

  <line x1="482" y1="190" x2="612" y2="190" stroke="#94a3b8"
        stroke-width="0.7" stroke-dasharray="3 2"/>

  <text x="547" y="208" text-anchor="middle" class="role-output">examples of class</text>
  <text x="547" y="221" text-anchor="middle" class="role-output">disciplines:</text>
  <text x="547" y="239" text-anchor="middle" class="role-output">• low-latency AQM</text>
  <text x="547" y="252" text-anchor="middle" class="role-output">• classic RED / WRED</text>
  <text x="547" y="265" text-anchor="middle" class="role-output">• fair-queued AQM</text>
  <text x="547" y="278" text-anchor="middle" class="role-output">• rate-capped FQ</text>
  <text x="547" y="291" text-anchor="middle" class="role-output">• scavenger / LE</text>

  <line x1="482" y1="306" x2="612" y2="306" stroke="#94a3b8"
        stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="547" y="324" text-anchor="middle" class="impl-hint">impl.: any QueueDisc</text>
  <text x="547" y="335" text-anchor="middle" class="impl-hint">per class; mix freely</text>
  <rect x="483" y="358" width="128" height="14" rx="3" fill="#fdf4c1" stroke="#a87014" stroke-width="0.6"/>
  <text x="547" y="368" text-anchor="middle" class="subtitle" fill="#7a4e0f">◨ mix: ns-3 + this work</text>

  <!-- ====== STAGE 4 — Service Policy ====== -->
  <rect x="652" y="95" width="140" height="285" rx="7" class="stage"/>
  <circle cx="667" cy="108" r="11" class="badge"/>
  <text x="667" y="108" class="badge-text">4</text>
  <text x="725" y="110" text-anchor="middle" class="stage-name">Service Policy</text>

  <text x="722" y="144" text-anchor="middle" class="role-statement">decides which class</text>
  <text x="722" y="158" text-anchor="middle" class="role-statement">to dequeue from</text>
  <text x="722" y="172" text-anchor="middle" class="role-statement">next</text>

  <line x1="667" y1="190" x2="782" y2="190" stroke="#94a3b8"
        stroke-width="0.7" stroke-dasharray="3 2"/>

  <text x="722" y="210" text-anchor="middle" class="role-output">examples of policy:</text>
  <text x="722" y="228" text-anchor="middle" class="role-output">• strict priority</text>
  <text x="722" y="241" text-anchor="middle" class="role-output">(one class wins)</text>
  <text x="722" y="260" text-anchor="middle" class="role-output">• deficit round-robin</text>
  <text x="722" y="273" text-anchor="middle" class="role-output">(per-class fair share)</text>
  <text x="722" y="292" text-anchor="middle" class="role-output">• weighted / HTB</text>

  <line x1="667" y1="307" x2="782" y2="307" stroke="#94a3b8"
        stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="722" y="325" text-anchor="middle" class="impl-hint">impl.: pluggable</text>
  <text x="722" y="336" text-anchor="middle" class="impl-hint">dispatcher strategy</text>
  <rect x="664" y="358" width="116" height="14" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="0.6"/>
  <text x="722" y="368" text-anchor="middle" class="subtitle" fill="#312e81">■ this work</text>
  </g>
  <!-- end edge-composer group -->

  <!-- ====== Feature matrix: which strategies each node class uses ======
       Second main box on the substrate row, separating component definitions
       (left) from node-class usage (right).  SaaS-style feature comparison:
       strategies as rows, DS-node classes as columns, cells as ✓/✗/qualifier.
       The edge/core asymmetry becomes an explicit table read rather than a
       buried layout constraint. -->
  <rect x="725" y="55" width="180" height="345" rx="8" class="core-box"/>
  <text x="815" y="77" text-anchor="middle" class="stage-name">Feature matrix</text>
  <text x="815" y="92" text-anchor="middle" class="subtitle">which strategies each DS-node class uses</text>

  <!-- Column headers -->
  <line x1="735" y1="108" x2="895" y2="108" stroke="#94a3b8" stroke-width="0.7"/>
  <text x="753" y="124" class="role-output" font-weight="600">strategy</text>
  <text x="856" y="124" text-anchor="middle" class="role-output" font-weight="600">Edge</text>
  <text x="888" y="124" text-anchor="middle" class="role-output" font-weight="600">Core</text>
  <line x1="735" y1="132" x2="895" y2="132" stroke="#94a3b8" stroke-width="0.7"/>

  <!-- Row 1: Classify & Meter -->
  <text x="740" y="152" class="role-output">① Classify &amp; Meter</text>
  <text x="856" y="152" text-anchor="middle" class="role-output" fill="#1d4e1b" font-weight="700">✓</text>
  <text x="888" y="152" text-anchor="middle" class="role-output" fill="#a83232" font-weight="700">✗</text>
  <line x1="735" y1="162" x2="895" y2="162" stroke="#e5e7eb" stroke-width="0.5"/>

  <!-- Row 2: Mark & Route -->
  <text x="740" y="180" class="role-output">② Mark &amp; Route</text>
  <text x="856" y="180" text-anchor="middle" class="role-output" fill="#1d4e1b" font-weight="700">✓</text>
  <text x="888" y="180" text-anchor="middle" class="role-output" fill="#a83232" font-weight="700">✗</text>
  <line x1="735" y1="190" x2="895" y2="190" stroke="#e5e7eb" stroke-width="0.5"/>

  <!-- Row 3: Per-class Queues — both use it, but differently -->
  <text x="740" y="208" class="role-output">③ Per-class Queues</text>
  <text x="856" y="208" text-anchor="middle" class="role-output" fill="#1d4e1b" font-size="9" font-weight="600">multi</text>
  <text x="888" y="208" text-anchor="middle" class="role-output" fill="#a87014" font-size="9" font-weight="600">single</text>
  <line x1="735" y1="218" x2="895" y2="218" stroke="#e5e7eb" stroke-width="0.5"/>

  <!-- Row 4: Service Policy -->
  <text x="740" y="236" class="role-output">④ Service Policy</text>
  <text x="856" y="236" text-anchor="middle" class="role-output" fill="#1d4e1b" font-weight="700">✓</text>
  <text x="888" y="236" text-anchor="middle" class="role-output" fill="#a83232" font-weight="700">✗</text>
  <line x1="735" y1="246" x2="895" y2="246" stroke="#94a3b8" stroke-width="0.7"/>

  <!-- Interpretation / legend -->
  <text x="815" y="268" text-anchor="middle" class="subtitle" font-style="italic">edge: per-flow classifier;</text>
  <text x="815" y="280" text-anchor="middle" class="subtitle" font-style="italic">up to 8 parallel classes</text>
  <text x="815" y="298" text-anchor="middle" class="subtitle" font-style="italic">core: per-class transit hop;</text>
  <text x="815" y="310" text-anchor="middle" class="subtitle" font-style="italic">one queue disc, reads DSCP</text>

  <!-- Asymmetry note -->
  <line x1="740" y1="324" x2="890" y2="324" stroke="#888" stroke-width="0.6"/>
  <text x="815" y="344" text-anchor="middle" class="subtitle" font-style="italic">RFC 2475 edge/core asymmetry</text>
  <text x="815" y="360" text-anchor="middle" class="subtitle">by design, not a gap:</text>
  <text x="815" y="372" text-anchor="middle" class="subtitle">scale requires core to stay</text>
  <text x="815" y="384" text-anchor="middle" class="subtitle">per-class, not per-flow</text>

  <!-- ====== Client configurations (foundation band) ====== -->
  <rect x="30" y="410" width="880" height="95" rx="6" class="foundation"/>
  <text x="42" y="425" class="title" fill="#333">THREE CONCRETE COMPOSITIONS OF THIS SUBSTRATE</text>

  <!-- Composition 1: DiffServ -->
  <rect x="42" y="431" width="852" height="17" rx="4" class="client-ds"/>
  <text x="54" y="444" class="client-head client-ds-t">DiffServ</text>
  <text x="160" y="444" class="client-body">EF / AF / BE classes · multi-precedence WRED queueing · strict-priority or WFQ policy</text>
  <text x="720" y="444" class="client-reuse">all introduced here</text>

  <!-- Composition 2: L4S -->
  <rect x="42" y="452" width="852" height="17" rx="4" class="client-l4s"/>
  <text x="54" y="465" class="client-head client-l4s-t">L4S</text>
  <text x="160" y="465" class="client-body">one low-latency isolated class · strict-priority policy (coupled dual-queue AQM)</text>
  <text x="720" y="465" class="client-reuse">DualPI2 inner (introduced here)</text>

  <!-- Composition 3: CAKE -->
  <rect x="42" y="473" width="852" height="17" rx="4" class="client-cake"/>
  <text x="54" y="486" class="client-head client-cake-t">CAKE</text>
  <text x="160" y="486" class="client-body">four rate-capped classes + per-class fair queueing · deficit-RR policy</text>
  <text x="720" y="486" class="client-reuse">reuses ns-3 FqCobalt + Tbf</text>
</svg>
